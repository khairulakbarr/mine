<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kasku – Catatan Keuangan Pribadi</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f6fb;--card:#fff;--tx:#0f172a;--mut:#64748b;--bd:#e5e9f2;--pri:#4f46e5;--pri2:#eef0ff;--inc:#059669;--incbg:#e6f7f0;--exp:#e11d48;--expbg:#ffeaf0;--sh:0 1px 2px rgba(15,23,42,.04),0 8px 24px rgba(15,23,42,.06);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1020;--card:#141b30;--tx:#e8ecf8;--mut:#93a0bd;--bd:#232c47;--pri:#818cf8;--pri2:#1e2548;--inc:#34d399;--incbg:#0f2a24;--exp:#fb7185;--expbg:#33141f;--sh:none}}
:root[data-theme="dark"]{--bg:#0b1020;--card:#141b30;--tx:#e8ecf8;--mut:#93a0bd;--bd:#232c47;--pri:#818cf8;--pri2:#1e2548;--inc:#34d399;--incbg:#0f2a24;--exp:#fb7185;--expbg:#33141f;--sh:none}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:15px;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}button{cursor:pointer;border:0;background:none}
.wrap{max-width:880px;margin:0 auto;padding:16px 16px 110px}
header{display:flex;align-items:center;justify-content:space-between;margin:6px 0 16px}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:20px;letter-spacing:-.02em}
.logo i{width:36px;height:36px;border-radius:11px;background:linear-gradient(135deg,#6366f1,#4338ca);display:grid;place-items:center;color:#fff;font-style:normal;font-size:18px}
.ghost{padding:8px 14px;border-radius:10px;background:var(--card);border:1px solid var(--bd);font-weight:600;font-size:13px}
.sy{font-size:12px;font-weight:700;color:var(--mut)}.sy.ok{color:var(--inc)}.sy.run{color:#d97706}.sy.off{color:var(--exp)}
.tb{display:grid;grid-template-columns:1.6fr .5fr 1.3fr .6fr;gap:8px;padding:9px 0;border-bottom:1px solid var(--bd);font-size:13px;align-items:center}.tb span:nth-child(n+2){text-align:right}.tb span:first-child{display:flex;align-items:center;gap:8px;min-width:0}.th{color:var(--mut);font-weight:700;font-size:12px}.dt{width:10px;height:10px;border-radius:3px;flex:none}
.donut{width:150px;height:150px;border-radius:50%;margin:0 auto 14px;position:relative}.donut::after{content:"";position:absolute;inset:28px;background:var(--card);border-radius:50%}
.tabs{display:flex;gap:4px;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:4px;margin-bottom:16px}
.tabs button{flex:1;padding:10px;border-radius:10px;font-weight:600;color:var(--mut)}
.tabs button.on{background:var(--pri);color:#fff}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:18px;box-shadow:var(--sh);margin-bottom:14px}
h2{font-size:15px;margin:0 0 12px;font-weight:700}
.bar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.seg{display:flex;background:var(--pri2);border-radius:10px;padding:3px}
.seg button{padding:7px 14px;border-radius:8px;font-weight:600;font-size:13px;color:var(--mut)}
.seg button.on{background:var(--card);color:var(--pri);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.nav{display:flex;align-items:center;gap:8px;font-weight:700}
.nav button{width:34px;height:34px;border-radius:10px;border:1px solid var(--bd);background:var(--card);font-size:16px}
.nav span{min-width:150px;text-align:center;font-size:14px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:14px}
.stat{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:14px 16px;box-shadow:var(--sh)}
.stat small{color:var(--mut);font-weight:600;font-size:12px}.stat b{display:block;font-size:19px;margin-top:4px;letter-spacing:-.02em;word-break:break-word}
.stat.i b{color:var(--inc)}.stat.e b{color:var(--exp)}.stat.s{background:linear-gradient(135deg,#4f46e5,#3730a3);border:0}.stat.s small,.stat.s b{color:#fff}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.row{margin-bottom:12px}.row .t{display:flex;justify-content:space-between;font-size:13px;font-weight:600;margin-bottom:5px}.row .t span:last-child{color:var(--mut)}
.trk{height:8px;background:var(--bd);border-radius:6px;overflow:hidden}.trk div{height:100%;border-radius:6px}
.chart{display:flex;align-items:flex-end;gap:4px;height:130px;padding-top:6px}
.chart .c{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;min-width:0}
.chart .pair{flex:1;display:flex;align-items:flex-end;gap:2px;width:100%;justify-content:center}
.chart .pair i{display:block;width:40%;max-width:18px;border-radius:4px 4px 0 0;min-height:2px}
.chart small{font-size:10px;color:var(--mut)}
.empty{color:var(--mut);text-align:center;padding:24px 0;font-size:14px}
.tx{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--bd)}.tx:last-child{border:0}
.ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-weight:800;flex:none}
.ic.i{background:var(--incbg);color:var(--inc)}.ic.e{background:var(--expbg);color:var(--exp)}
.tx .m{flex:1;min-width:0}.tx .m b{display:block;font-size:14px}.tx .m small{color:var(--mut);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.amt{font-weight:700;text-align:right;white-space:nowrap}.amt.i{color:var(--inc)}.amt.e{color:var(--exp)}
.act{display:flex;gap:4px;margin-left:4px}.act button{width:32px;height:32px;border-radius:9px;border:1px solid var(--bd);font-size:14px}
.day{font-size:12px;font-weight:700;color:var(--mut);margin:14px 0 2px;text-transform:uppercase;letter-spacing:.04em}
.fab{position:fixed;right:max(18px,calc(50% - 422px));bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--pri);color:#fff;padding:14px 22px;border-radius:16px;font-weight:700;box-shadow:0 10px 24px rgba(79,70,229,.4);z-index:5}
.modal{position:fixed;inset:0;background:rgba(8,12,28,.55);display:none;align-items:flex-end;justify-content:center;z-index:20;padding:0}
.modal.show{display:flex}
.sheet{background:var(--card);width:100%;max-width:480px;border-radius:22px 22px 0 0;padding:20px 20px calc(20px + env(safe-area-inset-bottom,0px));max-height:92vh;overflow:auto}
@media(min-width:600px){.modal{align-items:center}.sheet{border-radius:22px}}
label{display:block;font-size:12px;font-weight:700;color:var(--mut);margin:12px 0 5px}
input,select{width:100%;padding:12px;border-radius:12px;border:1px solid var(--bd);background:var(--bg);outline:0}
input:focus,select:focus{border-color:var(--pri)}
.type{display:grid;grid-template-columns:1fr 1fr;gap:8px}.type button{padding:11px;border-radius:12px;border:1px solid var(--bd);font-weight:700}
.type button.on.i{background:var(--incbg);color:var(--inc);border-color:var(--inc)}.type button.on.e{background:var(--expbg);color:var(--exp);border-color:var(--exp)}
.btns{display:flex;gap:10px;margin-top:18px}.btn{flex:1;padding:13px;border-radius:12px;font-weight:700;border:1px solid var(--bd)}.btn.p{background:var(--pri);color:#fff;border-color:var(--pri)}.btn.d{background:var(--exp);color:#fff;border-color:var(--exp)}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--pri2);color:var(--pri);border-radius:20px;padding:6px 6px 6px 12px;font-weight:600;font-size:13px;margin:0 6px 8px 0}
.chip button{width:22px;height:22px;border-radius:50%;background:var(--card);color:var(--exp);font-weight:800;line-height:1}
.add{display:flex;gap:8px;margin-top:6px}.add button{padding:0 18px;border-radius:12px;background:var(--pri);color:#fff;font-weight:700}
#lock{position:fixed;inset:0;background:var(--bg);z-index:50;display:none;align-items:center;justify-content:center;padding:20px}
#lock.show{display:flex}
.pinbox{width:100%;max-width:340px;text-align:center}
.pinbox .logo{justify-content:center;margin-bottom:22px;font-size:26px}
.pinbox p{color:var(--mut);margin:0 0 20px;font-weight:500}
.dots{display:flex;justify-content:center;gap:14px;margin-bottom:10px;height:16px}
.dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--pri)}.dots i.f{background:var(--pri)}
.err{color:var(--exp);font-size:13px;font-weight:600;height:20px;margin-bottom:10px}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.pad button{height:62px;border-radius:50%;background:var(--card);border:1px solid var(--bd);font-size:22px;font-weight:700}
.pad button:active{background:var(--pri2)}
.shake{animation:sh .35s}@keyframes sh{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
@media(max-width:620px){.grid3{grid-template-columns:1fr}.cols{grid-template-columns:1fr}.stat b{font-size:20px}.nav span{min-width:120px}.act{flex-direction:column}}
</style>
</head>
<body>
<div id="lock"><div class="pinbox"><div class="logo"><i>₹</i>Kasku</div><p id="lp"></p><div class="dots" id="dots"></div><div class="err" id="err"></div><div class="pad" id="pad"></div></div></div>

<div class="wrap" id="app" style="display:none">
<header><div class="logo"><i>₹</i>Kasku</div><div style="display:flex;align-items:center;gap:10px"><span id="sy" class="sy"></span><button class="ghost" onclick="lockNow()">🔒 Kunci</button></div></header>
<div class="tabs" id="tabs"></div>
<div id="view"></div>
</div>
<button class="fab" id="fab" style="display:none" onclick="openForm()">+ Transaksi</button>

<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>

<script>
const K='kasku_v1';
/* ==== KONFIGURASI SINKRON (isi di sini, bukan di tampilan webapp) ==== */
const API_URL='https://script.google.com/macros/s/AKfycbw_VTwJ8Lzubbu-J9S0jXtJNrKm12YtyM8-f2ojh9OpS6HAjrsZ5lfTs9SGthPktremVw/exec';  // tempel URL Web App Apps Script, berakhiran /exec
const API_KEY='';  // samakan dengan KEY di Code.gs
let S={q:[],seeded:false,tx:[],src:['Gaji','Freelance','Bisnis','Investasi','Lainnya'],cat:['Makanan','Transportasi','Tagihan','Belanja','Kesehatan','Hiburan','Pendidikan','Lainnya'],pin:null,theme:null};
try{const r=localStorage.getItem(K);if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
function save(){try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}}
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rp=n=>'Rp '+Math.round(n).toLocaleString('id-ID');
const pad2=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());
const pd=s=>{const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c)};
const MN=['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
const MS=MN.map(m=>m.slice(0,3));const HR=['Sen','Sel','Rab','Kam','Jum','Sab','Min'];
const COL=['#6366f1','#f59e0b','#10b981','#ec4899','#06b6d4','#8b5cf6','#f97316','#14b8a6','#ef4444'];
if(S.theme)document.documentElement.dataset.theme=S.theme;

/* ===== PIN ===== */
async function hash(p){try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('kasku:'+p));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){let h=5381;for(const c of 'kasku:'+p)h=(h*33)^c.charCodeAt(0);return 'f'+(h>>>0)}}
let buf='',stage='login',first='',onOk=null,L=6;
function lockUI(){
  $('lp').textContent={login:'Masukkan PIN untuk membuka',new:'Buat PIN 6 digit untuk mengamankan data',confirm:'Ulangi PIN untuk konfirmasi'}[stage];
  $('dots').innerHTML=Array.from({length:L},(_, i)=>`<i class="${i<buf.length?'f':''}"></i>`).join('');
}
$('pad').innerHTML=[1,2,3,4,5,6,7,8,9,'',0,'⌫'].map(k=>k===''?'<span></span>':`<button onclick="key('${k}')">${k}</button>`).join('');
function showLock(st,cb){stage=st;buf='';first='';onOk=cb||null;$('err').textContent='';$('lock').classList.add('show');$('app').style.display='none';$('fab').style.display='none';lockUI()}
async function key(k){
  if(k==='⌫')buf=buf.slice(0,-1);else if(buf.length<L)buf+=k;
  lockUI();$('err').textContent='';
  if(buf.length<L)return;
  const h=await hash(buf);
  if(stage==='login'){
    if(h===S.pin){$('lock').classList.remove('show');enter()}else bad('PIN salah, coba lagi')
  }else if(stage==='new'){first=buf;buf='';stage='confirm';lockUI()}
  else if(stage==='confirm'){
    if(buf===first){S.pin=h;save();$('lock').classList.remove('show');if(onOk)onOk();else enter()}
    else{stage='new';first='';bad('PIN tidak cocok, ulangi dari awal')}
  }
}
function bad(m){$('err').textContent=m;const d=$('dots');d.classList.remove('shake');void d.offsetWidth;d.classList.add('shake');buf='';setTimeout(lockUI,300)}
document.addEventListener('keydown',e=>{if(!$('lock').classList.contains('show'))return;if(/^\d$/.test(e.key))key(e.key);else if(e.key==='Backspace')key('⌫')});
function lockNow(){showLock('login')}
function enter(){$('app').style.display='block';$('fab').style.display=tab==='set'?'none':'block';render();startSync()}

/* ===== Periode ===== */
let tab='sum',mode='w',anchor=new Date();
function range(){
  const a=new Date(anchor.getFullYear(),anchor.getMonth(),anchor.getDate());
  if(mode==='d')return[a,a];if(mode==='w'){const dow=(a.getDay()+6)%7;const s=new Date(a);s.setDate(a.getDate()-dow);const e=new Date(s);e.setDate(s.getDate()+6);return[s,e]}
  return[new Date(a.getFullYear(),a.getMonth(),1),new Date(a.getFullYear(),a.getMonth()+1,0)]
}
function label(){const[s,e]=range();if(mode==='d')return HR[(s.getDay()+6)%7]+', '+s.getDate()+' '+MS[s.getMonth()]+' '+s.getFullYear();return mode==='m'?MN[s.getMonth()]+' '+s.getFullYear():`${s.getDate()} ${MS[s.getMonth()]} – ${e.getDate()} ${MS[e.getMonth()]} ${e.getFullYear()}`}
function shift(n){if(mode==='d')anchor.setDate(anchor.getDate()+n);else if(mode==='w')anchor.setDate(anchor.getDate()+7*n);else{anchor.setDate(1);anchor.setMonth(anchor.getMonth()+n)}render()}
function setMode(m){mode=m;render()}
function inRange(){const[s,e]=range();const a=iso(s),b=iso(e);return S.tx.filter(t=>t.date>=a&&t.date<=b)}
const sum=(l,ty)=>l.filter(t=>t.type===ty).reduce((a,t)=>a+t.amount,0);

/* ===== Render ===== */
function setTab(t){tab=t;$('fab').style.display=t==='set'?'none':'block';render()}
function periodBar(){return`<div class="bar"><div class="seg"><button class="${mode==='d'?'on':''}" onclick="setMode('d')">Harian</button><button class="${mode==='w'?'on':''}" onclick="setMode('w')">Mingguan</button><button class="${mode==='m'?'on':''}" onclick="setMode('m')">Bulanan</button></div><div class="nav"><button onclick="shift(-1)">‹</button><span>${label()}</span><button onclick="shift(1)">›</button><button onclick="anchor=new Date();render()" style="width:auto;padding:0 10px;font-size:12px">Hari ini</button></div></div>`}
function breakdown(list,ty){
  const m={};list.filter(t=>t.type===ty).forEach(t=>m[t.cat]=(m[t.cat]||0)+t.amount);
  const tot=Object.values(m).reduce((a,b)=>a+b,0);const ent=Object.entries(m).sort((a,b)=>b[1]-a[1]);
  if(!ent.length)return'<div class="empty">Belum ada data</div>';
  return ent.map(([k,v],i)=>`<div class="row"><div class="t"><span>${esc(k)}</span><span>${rp(v)} · ${Math.round(v/tot*100)}%</span></div><div class="trk"><div style="width:${v/tot*100}%;background:${ty==='i'?'var(--inc)':COL[i%COL.length]}"></div></div></div>`).join('')
}
function chart(list){
  const[s,e]=range();let b=[];
  if(mode==='w'){for(let i=0;i<7;i++){const d=new Date(s);d.setDate(s.getDate()+i);b.push({l:HR[i],k:iso(d),i:0,e:0})}
    list.forEach(t=>{const x=b.find(y=>y.k===t.date);if(x)x[t.type]+=t.amount})}
  else{const n=Math.ceil(e.getDate()/7);for(let i=0;i<n;i++)b.push({l:'M'+(i+1),i:0,e:0});
    list.forEach(t=>{const x=b[Math.floor((pd(t.date).getDate()-1)/7)];if(x)x[t.type]+=t.amount})}
  const mx=Math.max(1,...b.map(x=>Math.max(x.i,x.e)));
  return`<div class="chart">${b.map(x=>`<div class="c"><div class="pair"><i style="height:${x.i/mx*100}%;background:var(--inc)" title="${rp(x.i)}"></i><i style="height:${x.e/mx*100}%;background:var(--exp)" title="${rp(x.e)}"></i></div><small>${x.l}</small></div>`).join('')}</div>
  <div style="display:flex;gap:14px;font-size:12px;color:var(--mut);margin-top:10px"><span><b style="color:var(--inc)">●</b> Pemasukan</span><span><b style="color:var(--exp)">●</b> Pengeluaran</span>${mode==='m'?'<span>M = minggu ke-</span>':''}</div>`
}
function txList(list){
  if(!list.length)return'<div class="empty">Belum ada transaksi pada periode ini.<br>Tekan “+ Transaksi” untuk mencatat.</div>';
  const g={};list.slice().sort((a,b)=>b.date.localeCompare(a.date)||b.id-a.id).forEach(t=>(g[t.date]=g[t.date]||[]).push(t));
  return Object.keys(g).map(d=>{const dt=pd(d);return`<div class="day">${HR[(dt.getDay()+6)%7]}, ${dt.getDate()} ${MS[dt.getMonth()]} ${dt.getFullYear()}</div>`+g[d].map(t=>`<div class="tx"><div class="ic ${t.type}">${t.type==='i'?'↓':'↑'}</div><div class="m"><b>${esc(t.cat)}</b><small>${esc(t.note||(t.type==='i'?'Pemasukan':'Pengeluaran'))}</small></div><div class="amt ${t.type}">${t.type==='i'?'+':'−'}${rp(t.amount)}</div><div class="act"><button onclick="openForm(${t.id})" aria-label="Ubah">✎</button><button onclick="askDel(${t.id})" aria-label="Hapus">🗑</button></div></div>`).join('')}).join('')
}
function render(){
  $('tabs').innerHTML=[['sum','Ringkasan'],['tx','Transaksi'],['cat','Kategori'],['set','Pengaturan']].map(([k,v])=>`<button class="${tab===k?'on':''}" onclick="setTab('${k}')">${v}</button>`).join('');
  const l=inRange(),i=sum(l,'i'),e=sum(l,'e');let h='';
  if(tab==='sum')h=periodBar()+`<div class="grid3"><div class="stat i"><small>Pemasukan</small><b>${rp(i)}</b></div><div class="stat e"><small>Pengeluaran</small><b>${rp(e)}</b></div><div class="stat s"><small>Saldo ${{d:'hari',w:'minggu',m:'bulan'}[mode]} ini</small><b>${i-e<0?'−':''}${rp(Math.abs(i-e))}</b></div></div>
  ${mode==='d'?'':`<div class="card"><h2>${mode==='w'?'Aktivitas harian':'Aktivitas per minggu'}</h2>${chart(l)}</div>`}
  <div class="cols"><div class="card"><h2>Sumber pemasukan</h2>${breakdown(l,'i')}</div><div class="card"><h2>Kategori pengeluaran</h2>${breakdown(l,'e')}</div></div>${mode==='d'?`<div class="card" style="padding:6px 18px 14px"><h2 style="margin-top:12px">Transaksi hari ini</h2>${txList(l)}</div>`:''}`;
  else if(tab==='tx')h=periodBar()+`<div class="grid3"><div class="stat i"><small>Pemasukan</small><b>${rp(i)}</b></div><div class="stat e"><small>Pengeluaran</small><b>${rp(e)}</b></div><div class="stat s"><small>Saldo</small><b>${i-e<0?'−':''}${rp(Math.abs(i-e))}</b></div></div><div class="card" style="padding:6px 18px 14px">${txList(l)}</div>`;
  else if(tab==='cat')h=periodBar()+dash(l);else h=settings();
  $('view').innerHTML=h
}
function agg(l,ty,names){const a=l.filter(t=>t.type===ty);const ns=[...new Set([...names,...a.map(t=>t.cat)])];return ns.map(k=>{const x=a.filter(t=>t.cat===k);return{k,n:x.length,v:x.reduce((s,t)=>s+t.amount,0)}}).sort((p,q)=>q.v-p.v||q.n-p.n)}
function tbl(rows,tot,ty){if(!rows.some(r=>r.n))return'<div class="empty">Belum ada data</div>';
return`<div class="tb th"><span>Nama</span><span>Trx</span><span>Total</span><span>%</span></div>`+rows.map((r,i)=>`<div class="tb"><span><i class="dt" style="background:${ty==='i'?'var(--inc)':COL[i%COL.length]}"></i>${esc(r.k)}</span><span>${r.n}</span><span>${rp(r.v)}</span><span>${tot?Math.round(r.v/tot*100):0}%</span></div>`).join('')+`<div class="tb th"><span>Total</span><span>${rows.reduce((a,r)=>a+r.n,0)}</span><span>${rp(tot)}</span><span>100%</span></div>`}
function dash(l){
  const re=agg(l,'e',S.cat),ri=agg(l,'i',S.src),te=sum(l,'e'),ti=sum(l,'i'),top=re[0]&&re[0].v>0?re[0]:null;let c=0;
  const stops=re.filter(r=>r.v>0).map(r=>{const a=c/te*100;c+=r.v;return`${COL[re.indexOf(r)%COL.length]} ${a}% ${c/te*100}%`}).join(',');
  return`<div class="grid3"><div class="stat"><small>Total transaksi</small><b>${l.length}</b></div><div class="stat e"><small>Total pengeluaran</small><b>${rp(te)}</b></div><div class="stat"><small>Kategori terbesar</small><b>${top?esc(top.k):'–'}</b></div></div>
<div class="cols"><div class="card"><h2>Pengeluaran per kategori</h2>${te?`<div class="donut" style="background:conic-gradient(${stops})"></div>`:''}${tbl(re,te,'e')}</div><div class="card"><h2>Pemasukan per sumber</h2>${tbl(ri,ti,'i')}</div></div>`}
function chips(arr,k){return arr.map((x,n)=>`<span class="chip">${esc(x)}<button onclick="rmItem('${k}',${n})" aria-label="Hapus">×</button></span>`).join('')}
function settings(){return`<div class="card"><h2>Sumber pemasukan</h2>${chips(S.src,'src')}<div class="add"><input id="ns" placeholder="Sumber baru, mis. Dividen" maxlength="30"><button onclick="addItem('src','ns')">Tambah</button></div></div>
<div class="card"><h2>Kategori pengeluaran</h2>${chips(S.cat,'cat')}<div class="add"><input id="nc" placeholder="Kategori baru, mis. Zakat" maxlength="30"><button onclick="addItem('cat','nc')">Tambah</button></div></div>
<div class="card"><h2>Keamanan & tampilan</h2><div class="btns" style="margin:0;flex-wrap:wrap"><button class="btn" onclick="changePin()">Ubah PIN</button><button class="btn" onclick="toggleTheme()">Ganti tema</button><button class="btn" onclick="exportCsv()">Ekspor CSV</button></div></div>
<div class="card"><h2>Tentang data</h2><p style="margin:0;color:var(--mut);font-size:13px;line-height:1.6">${ON?'Data disimpan di perangkat ini dan otomatis disinkronkan ke Google Sheets Anda lewat Apps Script, sehingga sama di desktop, Safari, dan Android. PIN hanya berlaku per perangkat, jadi atur PIN di tiap perangkat.':'Mode lokal: API_URL belum diisi di kode, jadi data hanya tersimpan di browser perangkat ini. Isi API_URL dan API_KEY di bagian atas script untuk mengaktifkan sinkron.'}</p></div>`}
function addItem(k,id){const v=$(id).value.trim();if(!v||S[k].includes(v))return;S[k].push(v);syncSet();render()}
function rmItem(k,n){if(S[k].length<=1)return;S[k].splice(n,1);syncSet();render()}
function changePin(){showLock('new',()=>{enter()})}
function toggleTheme(){const d=document.documentElement,dark=d.dataset.theme?d.dataset.theme==='dark':matchMedia('(prefers-color-scheme:dark)').matches;S.theme=dark?'light':'dark';d.dataset.theme=S.theme;save()}
function exportCsv(){const r=['Tanggal,Jenis,Kategori/Sumber,Jumlah,Catatan',...S.tx.slice().sort((a,b)=>a.date.localeCompare(b.date)).map(t=>[t.date,t.type==='i'?'Pemasukan':'Pengeluaran',t.cat,t.amount,t.note||''].map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(','))].join('\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([r],{type:'text/csv'}));a.download='kasku.csv';a.click()}

/* ===== Form ===== */
let ft='e',eid=null;
function openForm(id){
  eid=id||null;const t=id?S.tx.find(x=>x.id===id):null;ft=t?t.type:'e';
  $('sheet').innerHTML=`<h2 style="font-size:18px">${t?'Ubah':'Tambah'} transaksi</h2>
  <div class="type"><button id="bi" class="i" onclick="setType('i')">↓ Pemasukan</button><button id="be" class="e" onclick="setType('e')">↑ Pengeluaran</button></div>
  <label>Jumlah (Rp)</label><input id="fa" inputmode="numeric" placeholder="0" value="${t?t.amount.toLocaleString('id-ID'):''}" oninput="this.value=this.value.replace(/\\D/g,'').replace(/\\B(?=(\\d{3})+(?!\\d))/g,'.')">
  <label id="fcl"></label><select id="fc"></select>
  <label>Tanggal</label><input id="fd" type="date" value="${t?t.date:iso(new Date())}">
  <label>Catatan (opsional)</label><input id="fn" maxlength="80" placeholder="mis. makan siang" value="${t?esc(t.note||''):''}">
  <div class="err" id="fe" style="margin:8px 0 0"></div>
  <div class="btns"><button class="btn" onclick="closeM()">Batal</button><button class="btn p" onclick="saveTx()">Simpan</button></div>`;
  setType(ft,t&&t.cat);$('modal').classList.add('show');
}
function setType(t,cat){ft=t;$('bi').classList.toggle('on',t==='i');$('be').classList.toggle('on',t==='e');
  const cur=cat||($('fc')&&$('fc').value);const arr=t==='i'?S.src:S.cat;
  $('fcl').textContent=t==='i'?'Sumber pemasukan':'Kategori pengeluaran';
  $('fc').innerHTML=arr.map(x=>`<option ${x===cur?'selected':''}>${esc(x)}</option>`).join('')}
function closeM(){$('modal').classList.remove('show')}
function saveTx(){
  const amount=parseInt($('fa').value.replace(/\D/g,''))||0,date=$('fd').value,cat=$('fc').value;
  if(amount<=0){$('fe').textContent='Jumlah harus lebih dari 0';return}
  if(!date){$('fe').textContent='Tanggal wajib diisi';return}
  const o={type:ft,amount,date,cat,note:$('fn').value.trim()};
  let rec;if(eid)rec=Object.assign(S.tx.find(x=>x.id===eid),o);else{rec={id:Date.now(),...o};S.tx.push(rec)}
  sync({op:'upsert',tx:rec});
  closeM();anchor=pd(date);render()
}
function askDel(id){const t=S.tx.find(x=>x.id===id);
  $('sheet').innerHTML=`<h2 style="font-size:18px">Hapus transaksi?</h2><p style="color:var(--mut);margin:0">${esc(t.cat)} · ${rp(t.amount)} pada ${t.date}. Tindakan ini tidak bisa dibatalkan.</p><div class="btns"><button class="btn" onclick="closeM()">Batal</button><button class="btn d" onclick="del(${id})">Hapus</button></div>`;$('modal').classList.add('show')}
function del(id){S.tx=S.tx.filter(x=>x.id!==id);sync({op:'del',id});closeM();render()}
$('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeM()});

/* ===== Sinkron Google Apps Script (antrean + polling) ===== */
const ON=!!(API_URL&&API_KEY);let busy=false,started=false;
function status(s){const e=$('sy');if(!e)return;e.textContent=!ON?'Mode lokal':s==='ok'?'● Tersinkron':s==='run'?'● Menyinkronkan…':'● Offline';e.className='sy '+(ON?s:'')}
function sync(o){S.q.push(o);save();flush()}
function syncSet(){S.q=S.q.filter(o=>o.op!=='settings');sync({op:'settings',src:S.src,cat:S.cat})}
function applyQ(tx){S.q.forEach(o=>{if(o.op==='upsert'){const i=tx.findIndex(t=>t.id===o.tx.id);if(i<0)tx.push({...o.tx});else tx[i]={...o.tx}}else if(o.op==='del')tx=tx.filter(t=>t.id!==o.id);else if(o.op==='settings'){S.src=o.src;S.cat=o.cat}});return tx}
async function flush(){
  if(!ON||busy)return;busy=true;status('run');
  try{
    if(S.q.length){const ops=S.q.slice();const r=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({key:API_KEY,ops})});const j=await r.json();if(j.error)throw 0;S.q.splice(0,ops.length);save()}
    const r=await fetch(API_URL+'?key='+encodeURIComponent(API_KEY)+'&t='+Date.now());const d=await r.json();if(d.error)throw 0;
    const old=JSON.stringify([S.tx,S.src,S.cat]);
    if(!S.seeded){S.seeded=true;if(!d.tx.length)S.tx.forEach(t=>S.q.push({op:'upsert',tx:t}));if(!d.settings)S.q.push({op:'settings',src:S.src,cat:S.cat})}
    if(d.settings){S.src=d.settings.src;S.cat=d.settings.cat}
    S.tx=applyQ(d.tx);save();
    if(JSON.stringify([S.tx,S.src,S.cat])!==old)render();
    status('ok');busy=false;if(S.q.length)flush();return
  }catch(e){status('off')}
  busy=false
}
function startSync(){status('run');flush();if(started)return;started=true;
  setInterval(()=>{if(!document.hidden&&!$('lock').classList.contains('show'))flush()},15000);
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)flush()});addEventListener('online',flush)}

/* ===== Start ===== */
if(S.pin)showLock('login');else showLock('new');
</script>
</body>
